name: Reproduce snapshot QC
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  snapshot-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r qc/requirements.lock.txt
      - run: python -m compileall -q scripts dags
      - run: bash qc/run_qc.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregate-quality-evidence
          path: |
            qc/reports/
            qc/evidence/
